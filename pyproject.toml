[tool.uv]
package = false

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-latent-piaa"
version = "0.1.0"
description = "Code for latent-representation analysis and personalized image aesthetics assessment with VLMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate",
    "albumentations",
    "matplotlib",
    "numpy",
    "opencv-python-headless",
    "pandas",
    "peft",
    "pillow",
    "scikit-learn",
    "scipy",
    "torch",
    "torchvision",
    "tqdm",
    "transformers",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
]
